<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuration - Mini Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/config.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Retour</a>
        <h1 class="h5 m-0">Configuration</h1>
        <div class="header-spacer"></div>
      </div>

      <div class="card">
        <div class="card-body">
          <form id="configForm" class="row g-3">
            <input id="modelFilter" class="form-control form-control-sm mb-2" placeholder="Filtrer les modèles..." />
            <div class="col-12 col-md-4">
              <label for="provider" class="form-label">Fournisseur</label>
              <select id="provider" class="form-select"></select>
            </div>
            <div class="col-12 col-md-8">
              <label for="model" class="form-label d-flex justify-content-between align-items-center">
                <span>Modèle</span>
                <small id="modelCount" class="text-secondary"></small>
              </label>
              <select id="model" class="form-select"></select>
            </div>
            <div class="col-12">
              <label for="apiKey" class="form-label">Clé API</label>
              <div class="d-flex align-items-center">
                <input id="apiKey" class="form-control" placeholder="Entrez votre clé API..." autocomplete="off" disabled>
                <button id="resetKey" type="button" class="btn btn-secondary position-absolute end-0 me-4" title="Change the Key" hidden>
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
              </div>
            </div>
            <div class="col-12 d-flex align-items-center gap-2">
              <button id="saveBtn" type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Enregistrer
              </button>
              <span id="status" class="ms-2 text-secondary"></span>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
