<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuration - Mini Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #111827; border: 1px solid #1f2937; }
      select, option, label { color: #111827; }
    </style>
  </head>
  <body>
    <div class="container py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Retour</a>
        <h1 class="h5 m-0">Configuration</h1>
        <div style="width:80px"></div>
      </div>

      <div class="card">
        <div class="card-body">
          <form id="configForm" class="row g-3">
            <div class="col-12 col-md-4">
              <label for="provider" class="form-label">Fournisseur</label>
              <select id="provider" class="form-select"></select>
            </div>
            <div class="col-12 col-md-8">
              <label for="model" class="form-label">Modèle</label>
              <select id="model" class="form-select"></select>
            </div>
            <div class="col-12">
              <button id="saveBtn" type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Enregistrer
              </button>
              <span id="status" class="ms-2 text-secondary"></span>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      let providers = [];
      let modelsByProvider = {};

      async function loadConfig() {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (!data.ok) throw new Error('Impossible de charger la configuration');
        providers = data.providers;
        modelsByProvider = data.models;

        const providerSel = document.getElementById('provider');
        const modelSel = document.getElementById('model');

        providerSel.innerHTML = providers.map(p => `<option value="${p}">${p}</option>`).join('');
        providerSel.value = data.config.provider;
        updateModels();
        modelSel.value = data.config.model;
      }

      function updateModels() {
        const providerSel = document.getElementById('provider');
        const modelSel = document.getElementById('model');
        const list = modelsByProvider[providerSel.value] || [];
        modelSel.innerHTML = list.map(m => `<option value="${m}">${m}</option>`).join('');
      }

      document.getElementById('provider').addEventListener('change', updateModels);

      document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const provider = document.getElementById('provider').value;
        const model = document.getElementById('model').value;
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');
        btn.disabled = true; status.textContent = 'Enregistrement...';
        try {
          const res = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ provider, model })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Erreur serveur');
          status.textContent = 'Configuration enregistrée';
        } catch (err) {
          status.textContent = err.message || String(err);
        } finally {
          btn.disabled = false;
        }
      });

      loadConfig().catch(err => {
        document.getElementById('status').textContent = err.message || String(err);
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
