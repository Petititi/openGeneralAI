<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Agent - Démo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #111827; border: 1px solid #1f2937; }
      .answer { white-space: pre-wrap; }
      .topbar { position: sticky; top: 0; z-index: 5; }
      a, a:hover { color: inherit; }
    </style>
  </head>
  <body>
    <div class="container py-3 topbar">
      <div class="d-flex justify-content-end">
        <a href="/config" class="btn btn-outline-secondary btn-sm" title="Configuration">
          <i class="bi bi-gear"></i>
        </a>
      </div>
    </div>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="text-center mb-4">
            <h1 class="h3">Mini Agent Conversationnel</h1>
            <p class="text-secondary">Posez une question ci-dessous. La réponse s'affichera au-dessus du champ.</p>
          </div>

          <div id="answerBox" class="card mb-3 d-none">
            <div class="card-body">
              <div id="answer" class="answer"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <form id="askForm" class="d-flex gap-2">
                <input id="question" name="question" class="form-control form-control-lg" placeholder="Entrez votre question..." autocomplete="off" />
                <button id="sendBtn" type="submit" class="btn btn-primary btn-lg">Envoyer</button>
              </form>
              <div id="status" class="form-text mt-2 text-secondary"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('askForm');
      const input = document.getElementById('question');
      const btn = document.getElementById('sendBtn');
      const answerBox = document.getElementById('answerBox');
      const answer = document.getElementById('answer');
      const status = document.getElementById('status');

      async function askServer(q) {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.answer || 'Erreur serveur');
        return data.answer;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        btn.disabled = true; status.textContent = 'Envoi...';
        try {
          const a = await askServer(q);
          answer.textContent = a;
          answerBox.classList.remove('d-none');
          status.textContent = '';
        } catch (err) {
          status.textContent = err.message || String(err);
        } finally {
          btn.disabled = false; input.focus();
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
