<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Agent - Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      body { background: #0f172a; color: #e2e8f0; }
      .card { border: 1px solid #334155; }
      .answer-box { 
        background: #1e293b; 
        border-left: 4px solid #3b82f6;
        margin-bottom: 1rem;
      }
      .question-box {
        background: rgba(30, 41, 59, 0.5);
        margin-bottom: 0.5rem;
        border-left: 4px solid #64748b;
      }
      .form-card {
        background: rgba(30, 41, 59, 0.7);
      }
      .answer { 
        white-space: pre-wrap;
        color: #f1f5f9;
      }
      .question {
        color: #cbd5e1;
        font-style: italic;
      }
      .topbar { position: sticky; top: 0; z-index: 5; }
      a, a:hover { color: inherit; }
      .btn-primary {
        background-color: #2563eb;
        border-color: #2563eb;
      }
      #conversation {
        max-height: 60vh;
        overflow-y: auto;
        padding-right: 0.5rem;
      }
      /* Scrollbar styling */
      #conversation::-webkit-scrollbar {
        width: 8px;
      }
      #conversation::-webkit-scrollbar-track {
        background: #1e293b;
      }
      #conversation::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container py-3 topbar">
      <div class="d-flex justify-content-end">
        <a href="/config" class="btn btn-outline-secondary btn-sm" title="Settings">
          <i class="bi bi-gear"></i>
        </a>
      </div>
    </div>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="text-center mb-4">
            <h1 class="h3">Mini Chat Agent</h1>
            <p class="text-secondary">Ask a question below. The conversation will appear above.</p>
          </div>

          <div id="conversation" class="mb-3">
            <!-- Conversation history will appear here -->
          </div>

          <div class="card form-card">
            <div class="card-body">
              <form id="askForm" class="d-flex gap-2">
                <input id="question" name="question" class="form-control form-control-lg" placeholder="Enter your question..." autocomplete="off" />
                <button id="sendBtn" type="submit" class="btn btn-primary btn-lg">Send</button>
              </form>
              <div id="status" class="form-text mt-2 text-secondary"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('askForm');
      const input = document.getElementById('question');
      const btn = document.getElementById('sendBtn');
      const conversation = document.getElementById('conversation');
      const status = document.getElementById('status');

      async function askServer(q) {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.answer || 'Server error');
        return data.answer;
      }

      function addToConversation(question, answer) {
        // Add question
        const questionElement = document.createElement('div');
        questionElement.className = 'card question-box';
        questionElement.innerHTML = `
          <div class="card-body">
            <div class="question">${question}</div>
          </div>
        `;
        conversation.appendChild(questionElement);
        
        // Add answer
        const answerElement = document.createElement('div');
        answerElement.className = 'card answer-box';
        answerElement.innerHTML = `
          <div class="card-body">
            <div class="answer">${answer}</div>
          </div>
        `;
        conversation.appendChild(answerElement);
        
        // Scroll to bottom
        conversation.scrollTop = conversation.scrollHeight;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        
        btn.disabled = true; 
        input.disabled = true;
        status.textContent = 'Sending...';
        
        try {
          const a = await askServer(q);
          addToConversation(q, a);
          input.value = '';
          status.textContent = '';
        } catch (err) {
          status.textContent = err.message || String(err);
          // Add error to conversation
          addToConversation(q, `Error: ${err.message || String(err)}`);
        } finally {
          btn.disabled = false; 
          input.disabled = false;
          input.focus();
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
