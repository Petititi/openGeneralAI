<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Agent - Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/chat.css') }}" rel="stylesheet">
  </head>
  <body>
    <div class="container py-3 topbar">
      <div class="d-flex justify-content-end">
        <a href="/config" class="btn btn-outline-secondary btn-sm" title="Settings">
          <i class="bi bi-gear"></i>
        </a>
      </div>
    </div>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="text-center mb-4">
            <h1 class="h3">Mini Chat Agent</h1>
            <p class="text-secondary">Ask a question below. The conversation will appear above.</p>
          </div>

          <div id="conversation" class="mb-3">
            <!-- Conversation history will appear here -->
          </div>

          <div class="card form-card">
            <div class="card-body">
              <form id="askForm" class="d-flex gap-2">
                <input id="question" name="question" class="form-control form-control-lg" placeholder="Enter your question..." autocomplete="off" />
                <button id="sendBtn" type="submit" class="btn btn-primary btn-lg">Send</button>
              </form>
              <div id="status" class="form-text mt-2 text-secondary"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
