<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Trajectory</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app">
        <header>
            <div class="title">Trajectory <span class="muted">#<span id="run-id">–</span></span></div>
            <div class="meta small">nodes: <span id="count-nodes">–</span> • edges: <span id="count-edges">–</span>
            </div>
            <div class="spacer"></div>
            <div class="legend plan"><span class="dot"></span>plan</div>
            <div class="legend tool"><span class="dot"></span>tool</div>
            <div class="legend done"><span class="dot"></span>done</div>
            <div class="legend other"><span class="dot"></span>autre</div>
            <div class="spacer"></div>
            <input id="search" type="search" placeholder="Rechercher…" />
            <select id="phase-filter">
                <option value="">Toutes phases</option>
                <option value="plan/">plan/*</option>
                <option value="act/run">act/run</option>
                <option value="done">done</option>
            </select>
            <button id="btn-fit">Fit</button>
            <button id="btn-layout">Re-layout</button>
            <button id="btn-export">Export</button>
        </header>

        <div id="cy"></div>

        <aside><div class="resizer"></div>
            <h3>Détails du noeud</h3>
            <div class="scroll" id="details">
                <div class="small muted">Cliquez sur un noeud pour voir les détails...</div>
            </div>
        </aside>
    </div>

    <!-- External libraries (same files as on npm, pinned with Subresource Integrity) -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.27.0/dist/cytoscape.min.js" integrity="sha384-VwuW2IohsVXuvpS+IKNUfOPkksgt5GfwwGzWyWKXF8uUtyG9THxXcVgD63eulBFQ" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js" integrity="sha384-2IH3T69EIKYC4c+RXZifZRvaH5SRUdacJW7j6HtE5rQbvLhKKdawxq6vpIzJ7j9M" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js" integrity="sha384-u69h9ebXeSjlg6q/rb1zKTRAGu/h8deCl0409xpS/QJctMKnc4M9Fzkm01VOQdeF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@andypf/json-viewer@2.8.0/dist/iife/index.js" integrity="sha384-6iQKtZx+CiR0gKJ2NVw9qcL553FLcIlOGF2N8V7Wzi/LwZb4KAzbnHuWZBpj8ofn" crossorigin="anonymous"></script>

    <!-- The trace is loaded from the JSON file given in ?trace= (see js/load.js) -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
